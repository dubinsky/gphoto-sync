plugins {
  id 'scala'
  id 'application'
  id 'org.podval.conventions'
  id 'org.podval.tools.scalajs' version '2.3.1'
  id 'com.diffplug.spotless' version '8.11.0'
}

description = 'Process Photographs'
group = 'org.podval.tools'
version = '0.0.1'

project.gradle.startParameter.excludedTaskNames.add('compileJava')

dependencies {
  implementation 'com.drewnoakes:metadata-extractor:2.22.0'
  implementation 'io.github.wasabithumb:jtoml:1.8.2'
  implementation 'org.jline:jline:4.5.0'
  implementation 'com.google.photos.library:google-photos-library-client:1.7.3'
  implementation 'com.google.auth:google-auth-library-oauth2-http:1.24.0'
  implementation 'com.microsoft.playwright:playwright:1.64.0'
  // auth 1.24.0 pulls grpc-api 1.60.1 while the Photos client stays on grpc 1.53.0.
  // 1.60 changed LoadBalancer.acceptResolvedAddresses from boolean to Status, so the channel panics.
  implementation enforcedPlatform('io.grpc:grpc-bom:1.60.1')
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

application {
  mainClass = 'org.podval.tools.photo.Cli'
}

tasks.withType(Test).configureEach {
  environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}

tasks.withType(JavaExec).configureEach {
  environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}

// JavaExec pipes stdin and stdout, so the forked process has no console.
// photo shell execs this java with the terminal inherited. The file is java, then the classpath.
// run uses the project toolchain, not the daemon JVM.
tasks.register('photoRuntime') {
  def runtimeFile = layout.buildDirectory.file('photo-runtime.txt')
  def classpath = sourceSets.main.runtimeClasspath
  def launcher = javaToolchains.launcherFor(java.toolchain)
  inputs.property('javaExecutable', launcher.map { it.executablePath.asFile.absolutePath })
  inputs.property('classpath', provider { classpath.asPath })
  outputs.file(runtimeFile)
  dependsOn(tasks.named('classes'))
  doLast {
    def javaBin = launcher.get().executablePath.asFile.absolutePath
    def out = runtimeFile.get().asFile
    out.parentFile.mkdirs()
    out.withWriter('UTF-8') { writer ->
      writer.write(javaBin)
      writer.write('\n')
      writer.write(classpath.asPath)
      writer.write('\n')
    }
  }
}

jar {
  manifest {
    attributes(
      'Implementation-Title'  : project.description,
      'Implementation-Version': project.version
    )
  }
}

tasks.register('sourcesJar', Jar) {
  from sourceSets.main.allSource
  archiveClassifier.set('sources')
}

tasks.register('scaladocJar', Jar) {
  from scaladoc.destinationDir
  archiveClassifier.set('scaladoc')
}
scaladocJar.dependsOn scaladoc

spotless {
  scala {
    target 'src/**/*.scala'
    scalafmt().configFile('.scalafmt.conf')
  }
}
