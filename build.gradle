plugins {
  id 'scala'
  id 'application'
  id 'org.podval.conventions'
  id 'org.podval.tools.scalajs' version '2.3.0'
}

description = 'Process Photographs'
group = 'org.podval.tools'
version = '0.0.1'

project.gradle.startParameter.excludedTaskNames.add('compileJava')

dependencies {
//  implementation 'org.slf4j:slf4j-api:2.0.17'
  implementation 'com.drewnoakes:metadata-extractor:2.22.0'
  implementation 'dev.zio:zio-cli_3:0.8.2'
  //libraryDependencies += "org.scala-lang" % "scala-reflect"  % scalaVersion.value % "provided"
  implementation 'io.github.wasabithumb:jtoml:1.8.2'
  implementation 'com.google.photos.library:google-photos-library-client:1.7.3'
  implementation 'com.google.auth:google-auth-library-oauth2-http:1.24.0'
  // auth 1.24.0 pulls grpc-api 1.60.1 while the Photos client stays on grpc 1.53.0.
  // 1.60 changed LoadBalancer.acceptResolvedAddresses from boolean to Status, so the channel panics.
  implementation enforcedPlatform('io.grpc:grpc-bom:1.60.1')
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

application {
  mainClass = 'org.podval.tools.photo.Cli'
}

jar {
  manifest {
    attributes(
      'Implementation-Title'  : project.description,
      'Implementation-Version': project.version
    )
  }
}

tasks.register('sourcesJar', Jar) {
  from sourceSets.main.allSource
  archiveClassifier.set('sources')
}

tasks.register('scaladocJar', Jar) {
  from scaladoc.destinationDir
  archiveClassifier.set('scaladoc')
}
scaladocJar.dependsOn scaladoc
